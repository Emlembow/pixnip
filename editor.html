<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/editor/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterSS</title>
    <script type="module" src="/src/editor/main.ts" defer></script>
  </head>

  <body>
    <header id="topbar">
      <div id="topbar-left">
        <span id="brand">BetterSS</span>
        <button id="btn-undo" class="icon-btn" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6L3.5 10.5 8 15"/><path d="M4 10.5h9.5a5.5 5.5 0 110 11H9"/></svg>
        </button>
        <button id="btn-redo" class="icon-btn" title="Redo (Ctrl+Y)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6l4.5 4.5L16 15"/><path d="M20 10.5h-9.5a5.5 5.5 0 100 11H15"/></svg>
        </button>
      </div>
      <div id="topbar-actions">
        <button id="btn-drag" class="pill drag" title="Hold and drag into any app — Slack, browser, Explorer">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="5" r="1.6"/><circle cx="15" cy="5" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="19" r="1.6"/><circle cx="15" cy="19" r="1.6"/></svg>
          Drag
        </button>
        <button id="btn-copy" class="pill ghost" title="Copy to clipboard (Ctrl+C)">Copy</button>
        <button id="btn-save" class="pill primary" title="Save (Enter)">Save</button>
      </div>
    </header>

    <main id="stage">
      <canvas id="scene"></canvas>

      <div id="text-wrap" class="hidden">
        <input id="text-input" type="text" spellcheck="false" autocomplete="off" placeholder="Type…" />
        <button id="text-bg-toggle" title="Toggle background pill">
          <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="6" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="15.5" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">A</text></svg>
        </button>
      </div>

      <!-- Snapchat-style brush size rail -->
      <div id="size-rail" class="float-panel">
        <div id="brush-preview"></div>
        <input id="stroke" type="range" min="2" max="24" value="6" title="Size" />
      </div>

      <!-- Instagram-style vertical tool rail -->
      <div id="tool-rail" class="float-panel">
        <button class="tool active" data-tool="pen" title="Pen (P)">
          <svg viewBox="0 0 24 24"><path d="M3 17.2V21h3.8L17.8 10 14 6.2 3 17.2zM20.7 7.1c.4-.4.4-1 0-1.4l-2.4-2.4c-.4-.4-1-.4-1.4 0l-1.8 1.8 3.8 3.8 1.8-1.8z"/></svg>
        </button>
        <button class="tool" data-tool="neon" title="Neon pen (N)">
          <svg viewBox="0 0 24 24"><path d="M13 2L4.5 13.5H11l-1 8.5L18.5 10H12z"/></svg>
        </button>
        <button class="tool" data-tool="highlighter" title="Highlighter (H)">
          <svg viewBox="0 0 24 24"><path d="M4 20h16v2H4zM6.2 13.4L15.6 4l4.4 4.4-9.4 9.4H6.2z" opacity="0.85"/></svg>
        </button>
        <button class="tool" data-tool="arrow" title="Arrow (A)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 19L18 6M18 6h-7M18 6v7"/></svg>
        </button>
        <button class="tool" data-tool="rect" title="Rectangle (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
        </button>
        <button class="tool" data-tool="ellipse" title="Ellipse (O)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>
        </button>
        <button class="tool" data-tool="text" title="Text (T)">
          <svg viewBox="0 0 24 24"><path d="M5 5h14v3h-2V7h-4v10h2v2H9v-2h2V7H7v1H5z"/></svg>
        </button>
        <button class="tool" data-tool="blur" title="Blur / redact (B)">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="5" height="5" opacity=".9"/><rect x="10" y="4" width="5" height="5" opacity=".5"/><rect x="4" y="10" width="5" height="5" opacity=".5"/><rect x="10" y="10" width="5" height="5" opacity=".9"/><rect x="16" y="10" width="4" height="5" opacity=".35"/><rect x="10" y="16" width="5" height="4" opacity=".35"/></svg>
        </button>
        <button class="tool" data-tool="badge" title="Step badge (D)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">1</text></svg>
        </button>
        <button class="tool" data-tool="eraser" title="Eraser (E)">
          <svg viewBox="0 0 24 24"><path d="M16.2 3.6l4.2 4.2c.8.8.8 2 0 2.8l-9 9c-.8.8-2 .8-2.8 0l-4.2-4.2c-.8-.8-.8-2 0-2.8l9-9c.8-.8 2-.8 2.8 0zM5.8 14l4.2 4.2 2.5-2.5-4.2-4.2L5.8 14z"/><rect x="3" y="20" width="18" height="2" rx="1"/></svg>
        </button>
        <div class="rail-divider"></div>
        <button class="tool" data-tool="crop" title="Crop (C)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2v15h15M2 7h15v15"/></svg>
        </button>
      </div>

      <!-- Color bar -->
      <div id="color-bar" class="float-panel"></div>

      <!-- Floating delete button for the selected shape -->
      <button id="sel-delete" class="hidden" title="Delete (Del)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </main>
  </body>
</html>
